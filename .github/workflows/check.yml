name: Ohara checks
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: python3 -m unittest discover -s tests -v
      - run: tests/test_setup.sh && tests/test_cli.sh && tests/static.sh
      - name: Check CLI with dummy configuration
        run: |
          cp .env.example .env
          scripts/check --static
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: DNS smoke test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-bcrypt dnsutils
      - run: PATH=/usr/bin:$PATH tests/smoke.sh
