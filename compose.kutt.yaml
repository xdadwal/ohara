name: ohara-kutt
services:
  kutt:
    image: ${KUTT_IMAGE:?Run scripts/kutt check}
    user: "${RUN_UID}:${RUN_GID}"
    init: true
    restart: unless-stopped
    read_only: true
    environment:
      NODE_ENV: production
      TZ: ${TZ}
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm
      PORT: "3000"
      DEFAULT_DOMAIN: ${KUTT_HOST}
      SITE_NAME: Ohara Links
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: kutt
      DB_USER: kutt
      DB_PASSWORD_FILE: /run/secrets/db_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DB_POOL_MIN: "0"
      DB_POOL_MAX: "5"
      REDIS_ENABLED: "false"
      DISALLOW_REGISTRATION: "true"
      DISALLOW_ANONYMOUS_LINKS: "true"
      MAIL_ENABLED: "false"
      OIDC_ENABLED: "false"
      ENABLE_RATE_LIMIT: "true"
      TRUST_PROXY: "true"
      CUSTOM_DOMAIN_USE_HTTPS: "true"
    ports: ["127.0.0.1:3010:3000"]
    volumes:
      - type: bind
        source: ${KUTT_ROOT}/secrets/db-password
        target: /run/secrets/db_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KUTT_ROOT}/secrets/jwt-secret
        target: /run/secrets/jwt_secret
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:uid=${RUN_UID},gid=${RUN_GID},mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  postgres:
    image: ${KUTT_POSTGRES_IMAGE:?Run scripts/kutt check}
    user: "70:70"
    restart: unless-stopped
    read_only: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-local=trust --auth-host=scram-sha-256
    volumes:
      - type: bind
        source: ${KUTT_ROOT}/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
      - type: bind
        source: ${KUTT_ROOT}/secrets/db-password
        target: /run/secrets/db_password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KUTT_INIT_SCRIPT}
        target: /docker-entrypoint-initdb.d/10-kutt.sh
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:uid=70,gid=70,mode=1777", "/var/run/postgresql:uid=70,gid=70,mode=3775"]
    shm_size: 128mb
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres && test -f /var/lib/postgresql/data/.ohara-kutt-initialized"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging: *logging
