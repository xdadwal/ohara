name: ohara
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  homepage:
    <<: *defaults
    image: ${HOMEPAGE_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN}
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_EXTERNAL_URL: https://${DOMAIN}
      HOMEPAGE_VAR_REQUESTS_HOST: ${REQUESTS_HOST}
      HOMEPAGE_VAR_FILES_HOST: ${FILES_HOST}
      HOMEPAGE_VAR_JELLYFIN_HOST: ${JELLYFIN_HOST}
      HOMEPAGE_VAR_SPEED_HOST: ${SPEED_HOST}
    env_file:
      - path: ./local/homepage.env
        required: false
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/homepage
        target: /app/config
        bind:
          create_host_path: false
    tmpfs:
      - /app/.next/cache:uid=${RUN_UID},gid=${RUN_GID}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  seerr:
    <<: *defaults
    image: ${SEERR_IMAGE:?Run scripts/check}
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/seerr
        target: /app/config
        bind:
          create_host_path: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:5055/api/v1/settings/public]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
  copyparty:
    <<: *defaults
    image: ${COPYPARTY_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    ports:
      - "127.0.0.1:3923:3923"
    volumes:
      - type: bind
        source: ./local/copyparty.conf
        target: /cfg/copyparty.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_ROOT}/copyparty
        target: /cfg/state
        bind:
          create_host_path: false
      - type: bind
        source: ${FILES_ROOT}
        target: /w
        bind:
          create_host_path: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  speedtest:
    <<: *defaults
    image: ${SPEED_IMAGE:?Run scripts/check}
    ports:
      - "127.0.0.1:3000:3000"
    security_opt: ["no-new-privileges:true"]
  pihole:
    <<: *defaults
    image: ${PIHOLE_IMAGE:?Run scripts/check}
    environment:
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
    env_file:
      - path: ./local/pihole.env
        # Static rendering must work without secrets, including Compose 2.38.
        # scripts/check and scripts/up still require this file before startup.
        required: false
    ports:
      - "${LAN_IP}:53:53/tcp"
      - "${LAN_IP}:53:53/udp"
      - "127.0.0.1:8888:80"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/pihole
        target: /etc/pihole
        bind:
          create_host_path: false
  jellyfin:
    <<: *defaults
    image: ${JELLYFIN_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_HOST}
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/jellyfin
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library
        target: /media
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT}/jellyfin-cache
        target: /cache
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  radarr:
    <<: *defaults
    image: ${RADARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:7878:7878"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/radarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  sonarr:
    <<: *defaults
    image: ${SONARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/sonarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  prowlarr:
    <<: *defaults
    image: ${PROWLARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:9696:9696"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/prowlarr
        target: /config
        bind: {create_host_path: false}
  qbittorrent:
    <<: *defaults
    image: ${QBITTORRENT_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
      WEBUI_PORT: "8081"
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
