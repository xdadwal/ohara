name: ohara
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  homepage:
    <<: *defaults
    image: ${HOMEPAGE_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_HOST:-${DOMAIN}}
      HOMEPAGE_AUTH_ENABLED: "true"
      HOMEPAGE_EXTERNAL_URL: https://${HOMEPAGE_HOST:-${DOMAIN}}
      HOMEPAGE_VAR_REQUESTS_HOST: ${REQUESTS_HOST}
      HOMEPAGE_VAR_JELLYFIN_HOST: ${JELLYFIN_HOST}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      HOMEPAGE_VAR_SPEED_HOST: ${SPEED_HOST}
      HOMEPAGE_VAR_NAVIDROME_HOST: ${NAVIDROME_HOST}
      HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET:-}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD:-}
      HOMEPAGE_VAR_JELLYFIN_API_KEY: ${HOMEPAGE_VAR_JELLYFIN_API_KEY:-}
      HOMEPAGE_VAR_SEERR_API_KEY: ${HOMEPAGE_VAR_SEERR_API_KEY:-}
      HOMEPAGE_VAR_IMMICH_API_KEY: ${HOMEPAGE_VAR_IMMICH_API_KEY:-}
      HOMEPAGE_VAR_BAMBUDDY_API_KEY: ${HOMEPAGE_VAR_BAMBUDDY_API_KEY:-}
      HOMEPAGE_VAR_NAVIDROME_TOKEN: ${HOMEPAGE_VAR_NAVIDROME_TOKEN:-}
      HOMEPAGE_VAR_RADARR_API_KEY: ${HOMEPAGE_VAR_RADARR_API_KEY:-}
      HOMEPAGE_VAR_SONARR_API_KEY: ${HOMEPAGE_VAR_SONARR_API_KEY:-}
      HOMEPAGE_VAR_LIDARR_API_KEY: ${HOMEPAGE_VAR_LIDARR_API_KEY:-}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${HOMEPAGE_VAR_QBITTORRENT_PASSWORD:-}
      HOMEPAGE_VAR_ADGUARD_PASSWORD: ${HOMEPAGE_VAR_ADGUARD_PASSWORD:-}
      HOMEPAGE_VAR_NTFY_PASSWORD: ${HOMEPAGE_VAR_NTFY_PASSWORD:-}
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/homepage
        target: /app/config
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media-storage
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /app/.next/cache:uid=${RUN_UID},gid=${RUN_GID}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  seerr:
    <<: *defaults
    image: ${SEERR_IMAGE:?Run scripts/check}
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - type: bind
        source: ${DATA_ROOT}/seerr
        target: /app/config
        bind:
          create_host_path: false
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:5055/api/v1/settings/public]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
  speedtest:
    <<: *defaults
    image: ${SPEED_IMAGE:?Run scripts/check}
    ports:
      - "127.0.0.1:3000:3000"
    security_opt: ["no-new-privileges:true"]
  jellyfin:
    <<: *defaults
    image: ${JELLYFIN_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_HOST}
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/jellyfin
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library
        target: /media
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT}/jellyfin-cache
        target: /cache
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  navidrome:
    <<: *defaults
    image: ${NAVIDROME_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
    ports: ["127.0.0.1:4533:4533"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/navidrome
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library/music
        target: /music
        read_only: true
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  radarr:
    <<: *defaults
    image: ${RADARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:7878:7878"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/radarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  sonarr:
    <<: *defaults
    image: ${SONARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/sonarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  lidarr:
    <<: *defaults
    image: ${LIDARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:8686:8686"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/lidarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  bazarr:
    <<: *defaults
    image: ${BAZARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:6767:6767"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/bazarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library
        target: /data/library
        bind: {create_host_path: false}
  prowlarr:
    <<: *defaults
    image: ${PROWLARR_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
    ports: ["127.0.0.1:9696:9696"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/prowlarr
        target: /config
        bind: {create_host_path: false}
  qbittorrent:
    <<: *defaults
    image: ${QBITTORRENT_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      TZ: ${TZ}
      UMASK: "002"
      WEBUI_PORT: "8081"
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
