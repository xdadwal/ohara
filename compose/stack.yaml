# The eleven-application main stack: one project, one file per group of services that
# call each other. Operate it with scripts/check, scripts/up and scripts/status, which
# supply validated values; never run Compose here directly.
name: ohara

# Paths are relative to the repository root, the project directory the scripts pass.
# Compose reads a .env beside each included file unless env_file says otherwise, so
# every entry points it at /dev/null. Never set project_directory here: that makes
# Compose read the private .env. tests/test_stack.py checks both.
include:
  - path: compose/stack/media.yaml
    env_file: /dev/null
  - path: compose/stack/navidrome.yaml
    env_file: /dev/null
  - path: compose/stack/homepage.yaml
    env_file: /dev/null
  - path: compose/stack/speedtest.yaml
    env_file: /dev/null
