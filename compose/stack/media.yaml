# Main stack: playback, requests and acquisition. Seerr uses Jellyfin, Radarr and
# Sonarr; the Arr applications use Prowlarr and qBittorrent; Bazarr uses Radarr and
# Sonarr. Included by ../stack.yaml; see docs/media.md.

# Every service: restart policy and bounded logs.
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

# LinuxServer images (Arr applications, Bazarr, qBittorrent): run as the configured
# user without capabilities; their init needs a writable, executable /run.
x-linuxserver: &linuxserver
  <<: *defaults
  user: "${RUN_UID}:${RUN_GID}"
  tmpfs: ["/run:uid=${RUN_UID},gid=${RUN_GID},exec"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
x-linuxserver-environment: &linuxserver-environment
  TZ: ${TZ}
  UMASK: "002"

services:
  jellyfin:
    <<: *defaults
    image: ${JELLYFIN_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: https://${JELLYFIN_HOST}
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/jellyfin
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library
        target: /media
        read_only: false
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT}/jellyfin-cache
        target: /cache
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  seerr:
    <<: *defaults
    image: ${SEERR_IMAGE:?Run scripts/check}
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports: ["127.0.0.1:5055:5055"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/seerr
        target: /app/config
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1:5055/api/v1/settings/public]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
  radarr:
    <<: *linuxserver
    image: ${RADARR_IMAGE:?Run scripts/check}
    environment: *linuxserver-environment
    ports: ["127.0.0.1:7878:7878"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/radarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  sonarr:
    <<: *linuxserver
    image: ${SONARR_IMAGE:?Run scripts/check}
    environment: *linuxserver-environment
    ports: ["127.0.0.1:8989:8989"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/sonarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  lidarr:
    <<: *linuxserver
    image: ${LIDARR_IMAGE:?Run scripts/check}
    environment: *linuxserver-environment
    ports: ["127.0.0.1:8686:8686"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/lidarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
  bazarr:
    <<: *linuxserver
    image: ${BAZARR_IMAGE:?Run scripts/check}
    environment: *linuxserver-environment
    ports: ["127.0.0.1:6767:6767"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/bazarr
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library
        target: /data/library
        bind: {create_host_path: false}
  prowlarr:
    <<: *linuxserver
    image: ${PROWLARR_IMAGE:?Run scripts/check}
    environment: *linuxserver-environment
    ports: ["127.0.0.1:9696:9696"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/prowlarr
        target: /config
        bind: {create_host_path: false}
  qbittorrent:
    <<: *linuxserver
    image: ${QBITTORRENT_IMAGE:?Run scripts/check}
    environment:
      <<: *linuxserver-environment
      WEBUI_PORT: "8081"
    ports: ["127.0.0.1:8081:8081"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/qbittorrent
        target: /config
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}
        target: /data
        bind: {create_host_path: false}
