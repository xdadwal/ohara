# Main stack: music playback. Reads the music library and calls no other service.
# Included by ../stack.yaml; see docs/media.md.
services:
  navidrome:
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    image: ${NAVIDROME_IMAGE:?Run scripts/check}
    user: "${RUN_UID}:${RUN_GID}"
    environment:
      TZ: ${TZ}
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
    ports: ["127.0.0.1:4533:4533"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}/navidrome
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${MEDIA_ROOT}/library/music
        target: /music
        read_only: true
        bind: {create_host_path: false}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
