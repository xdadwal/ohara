- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: "https://{{HOMEPAGE_VAR_JELLYFIN_HOST}}"
        description: Watch movies and shows
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
          enableUser: false
          enableMediaControl: false
          fields: [movies, series, episodes]
    - Navidrome:
        icon: navidrome.png
        href: "https://{{HOMEPAGE_VAR_NAVIDROME_HOST}}"
        description: Listen to your music library
        widget:
          type: navidrome
          url: http://navidrome:4533
          user: admin
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: ohara-homepage
- Photos:
    - Immich:
        icon: immich.png
        href: "https://immich.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Personal photos and videos
        widget:
          type: immich
          url: "https://immich.{{HOMEPAGE_VAR_DOMAIN}}"
          key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
          version: 2
          fields: [photos, videos, storage]
- Tools:
    - AdGuard Home:
        icon: adguard-home.png
        href: "https://adguard.{{HOMEPAGE_VAR_DOMAIN}}"
        description: DNS administration (local network)
    - OpenSpeedTest:
        icon: openspeedtest.png
        href: "https://{{HOMEPAGE_VAR_SPEED_HOST}}"
        description: Test your connection to Ohara
- Media administration:
    - Seerr:
        icon: jellyseerr.png
        href: "https://{{HOMEPAGE_VAR_REQUESTS_HOST}}"
        description: Discover and request movies and shows
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
          fields: [pending, processing, issues]
    - Radarr:
        icon: radarr.png
        href: "https://radarr.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Movies (local network)
    - Sonarr:
        icon: sonarr.png
        href: "https://sonarr.{{HOMEPAGE_VAR_DOMAIN}}"
        description: TV shows (local network)
    - Prowlarr:
        icon: prowlarr.png
        href: "https://prowlarr.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Indexers (local network)
    - qBittorrent:
        icon: qbittorrent.png
        href: "https://qbittorrent.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Downloads (local network)
    - Lidarr:
        icon: lidarr.png
        href: "https://lidarr.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Music acquisition (local network)
    - Bazarr:
        icon: bazarr.png
        href: "https://bazarr.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Subtitles (local network)
    - Maintainerr:
        icon: maintainerr.png
        href: "https://maintainerr.{{HOMEPAGE_VAR_DOMAIN}}"
        description: Media maintenance (local network)
