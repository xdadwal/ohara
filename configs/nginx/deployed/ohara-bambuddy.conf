# Managed by scripts/bambuddy-proxy; public after verified native owner setup.
server {
    listen 80;
    listen [::]:80;
    server_name bambuddy.xdadwal.in;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bambuddy.xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Some management APIs accept keys in URLs; avoid recording those URLs.
    access_log off;
    error_log /dev/null;
    client_max_body_size 1g;
    location / {
        proxy_pass http://127.0.0.1:8008;
        # Managed by Ohara
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This server is the public edge. Discard incoming client-supplied chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        # Do not let a caller impersonate an identity-provider login.
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ohara_connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
