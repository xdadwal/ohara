# Managed by scripts/immich-proxy; independent of the main Ohara routes.
server {
    listen 80;
    listen [::]:80;
    server_name immich.xdadwal.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ohara/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
# Separate, opt-in server block. Replace placeholders after owner/restore acceptance.
# Never install alongside a duplicate server_name or use unverified certificate paths.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name immich.xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50000M;
    client_body_buffer_size 1024k;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:2283;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
