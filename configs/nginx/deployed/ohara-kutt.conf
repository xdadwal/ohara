# Managed by scripts/kutt-proxy; LAN-only owner onboarding.
geo $ohara_kutt_allowed {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    192.168.1.0/24 1;
}
limit_req_zone $binary_remote_addr zone=ohara_kutt_login:1m rate=5r/m;
server {
    listen 80;
    listen [::]:80;
    server_name kutt.xdadwal.in;
    if ($ohara_kutt_allowed = 0) { return 403; }
    access_log off;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kutt.xdadwal.in;
    if ($ohara_kutt_allowed = 0) { return 403; }
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log off;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    # Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

    # Never expose an unclaimed owner flow, even after loss/restoration of state.
    location ~* ^/(?:api/(?:v2/)?auth/create-admin|create-admin)/?$ {
        if ($ohara_kutt_allowed = 0) { return 403; }
        limit_req zone=ohara_kutt_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
    }
    # All privileged routes in the pinned Kutt release stay LAN-only.
    # Case-insensitive matching mirrors Express and covers both API aliases.
    location ~* ^/(?:admin(?:/|$)|api/(?:v2/)?(?:links|users|domains)/admin(?:/|$)|(?:create-user|add-domain|confirm-link-ban|confirm-user-(?:ban|delete)|confirm-domain-(?:ban|delete-admin))/?$) {
        if ($ohara_kutt_allowed = 0) { return 403; }
        proxy_pass http://127.0.0.1:3010;
    }
    location ~* ^/api/(?:v2/)?auth/login/?$ {
        limit_req zone=ohara_kutt_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}
