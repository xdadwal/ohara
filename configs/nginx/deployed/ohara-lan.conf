# Host-specific LAN administration routes for xdadwal.in (2026-10-22).
# Backend ports stay on loopback. DNS rewrites alone do not provide access control.
geo $ohara_lan_allowed {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    192.168.1.0/24 1;
}
server {
    listen 80;
    listen [::]:80;
    server_name adguard.xdadwal.in radarr.xdadwal.in sonarr.xdadwal.in prowlarr.xdadwal.in qbittorrent.xdadwal.in lidarr.xdadwal.in bazarr.xdadwal.in maintainerr.xdadwal.in;
    # Reject before redirects, including callers supplying forged forwarding headers.
    if ($ohara_lan_allowed = 0) { return 403; }
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adguard.xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ohara_lan_allowed = 0) { return 403; }
    # Some management APIs accept keys in URLs; avoid recording those URLs.
    access_log off;
    error_log /dev/null;
    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:3003;
        # Managed by Ohara
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # This server is the public edge. Discard incoming client-supplied chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        # Do not let a caller impersonate an identity-provider login.
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ohara_connection_upgrade;
        proxy_read_timeout 300s;
    }
}
