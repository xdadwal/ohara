# Managed by Ohara
# Temporary public-IP reachability probe. No application or administration data.
server {
    listen 80;
    listen [::]:80;
    server_name 45.120.160.21;
    access_log /var/log/nginx/ohara-public-ip-test.access.log;
    location / {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "Ohara public IP test OK\n";
    }
}
