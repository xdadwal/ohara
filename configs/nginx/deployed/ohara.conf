# localhost opens the canonical dashboard so Homepage login cookies remain valid.
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;
    location / { return 302 https://xdadwal.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/ohara/tls/server.crt;
    ssl_certificate_key /etc/ohara/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 302 https://xdadwal.in$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # nginx.conf compresses only text/html; cover the portfolio's other text types.
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml;
    gzip_vary on;
    # Browser caching for static files. HTML gets no Cache-Control here: every visit
    # must fetch a fresh page, because the page points at the current CSS version.
    # No "always": 404s and errors must not be cached.
    # The portfolio links CSS and fonts with a content version (?v=), so they can be
    # cached for a year. This depends on the app always linking them that way.
    location ^~ /static/css/ {
        proxy_pass http://127.0.0.1:8010;
# Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /static/fonts/ {
        proxy_pass http://127.0.0.1:8010;
# Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Images and the favicon are not versioned: a week, then revalidate by ETag.
    location ^~ /static/img/ {
        proxy_pass http://127.0.0.1:8010;
# Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        add_header Cache-Control "public, max-age=604800";
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8010;
# Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        add_header Cache-Control "public, max-age=604800";
    }
    # Anything else under /static: one hour.
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:8010;
# Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        proxy_pass http://127.0.0.1:8010;
# Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

    }
}
# www redirects straight to the apex in one hop; the wildcard certificate covers it.
server {
    listen 80;
    listen [::]:80;
    server_name www.xdadwal.in;
    return 301 https://xdadwal.in$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://xdadwal.in$request_uri;
}

