# Managed by Ohara
# HTTPS active: trusted wildcard TLS; apex portfolio, dashboard at ohara.xdadwal.in.
limit_req_zone $binary_remote_addr zone=ohara_homepage_login:10m rate=5r/m;
map $http_upgrade $ohara_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name ohara.xdadwal.in xdadwal.in files.xdadwal.in speed.xdadwal.in tv.xdadwal.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ohara/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ohara.xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /api/auth/callback/credentials {
        limit_req zone=ohara_homepage_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3002;
        # Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

    }
    location / {
        proxy_pass http://127.0.0.1:3002;
        # Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ohara_connection_upgrade;
    }
}
# Seerr is LAN-only on this host (owner decision, 2026-11-18) while it stays on
# the owner-selected image affected by GHSA-849x-56wc-5rrv. $ohara_lan_allowed is
# defined in ohara-lan.conf, which must be installed alongside this file. Remote
# requests still work through Jellyfin Enhanced, which reaches Seerr server-side.
server {
    listen 80;
    listen [::]:80;
    server_name seerr.xdadwal.in;
    # Reject before redirects, including callers supplying forged forwarding headers.
    if ($ohara_lan_allowed = 0) { return 403; }
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seerr.xdadwal.in;
    ssl_certificate /etc/letsencrypt/live/ohara-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohara-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($ohara_lan_allowed = 0) { return 403; }
    client_max_body_size 10m;
    # Nginx can normalize an encoded traversal out of $uri while proxy_pass still
    # sends the original request path. Check the raw request URI as well.
    if ($request_uri ~* "^/imageproxy(?:/|$|\?)") {
        return 404;
    }
    # Match Nginx's normalized, percent-decoded URI so path-equivalence forms
    # cannot reach Seerr's unauthenticated image proxy.
    location ~* ^/imageproxy(?:/|$) {
        return 404;
    }
    location / {
        proxy_pass http://127.0.0.1:5055;
        # Managed by Ohara
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# This server is the public edge. Discard incoming client-supplied chains.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Do not let a caller impersonate an identity-provider login.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ohara_connection_upgrade;
        proxy_read_timeout 300s;
    }
}

