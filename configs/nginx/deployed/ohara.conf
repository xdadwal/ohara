# localhost opens the canonical dashboard so Homepage login cookies remain valid.
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;
    location / { return 302 https://xdadwal.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 127.0.0.1;
    ssl_certificate /etc/ohara/tls/server.crt;
    ssl_certificate_key /etc/ohara/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / { return 302 https://xdadwal.in$request_uri; }
}

